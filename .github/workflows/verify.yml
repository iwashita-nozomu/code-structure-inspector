name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/code-structure-inspector
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/code-structure-inspector
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/release/code-structure-inspector.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --offline -- -D warnings
      - run: cargo test --locked --offline
      - run: cargo build --locked --release --offline
      - run: python scripts/licenses.py --check
      - run: python scripts/check_package.py --binary ${{ matrix.binary }}
      - name: Package versioned plugin
        run: python scripts/package.py --target ${{ matrix.target }} --binary ${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-structure-inspector-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
