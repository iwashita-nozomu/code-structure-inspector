[package]
name = "code-structure-inspector"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Bounded local static dependency evidence for Codex"
repository = "https://github.com/iwashita-nozomu/code-structure-inspector"

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-cpp = "0.23.4"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
